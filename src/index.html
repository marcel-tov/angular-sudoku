<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sudoku</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the dark theme before Angular boots to avoid a flash of the light theme.
    // Must stay in sync with ThemeService (storage key 'theme', class 'dark-theme').
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    #loading-animation {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: url(assets/loading-animation.gif) center 20% no-repeat transparent;
      background-size: 80px 80px;
    }
  </style>
</head>
<body>
  <app-root>
    <div id="loading-animation"></div>
  </app-root>
</body>
</html>
